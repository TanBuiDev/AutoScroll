name: Build Signed Play Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-play-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate signing secrets
        shell: bash
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          AUTOSCROLL_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          AUTOSCROLL_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          AUTOSCROLL_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$PLAY_UPLOAD_KEYSTORE_BASE64"
          test -n "$AUTOSCROLL_UPLOAD_STORE_PASSWORD"
          test -n "$AUTOSCROLL_UPLOAD_KEY_ALIAS"
          test -n "$AUTOSCROLL_UPLOAD_KEY_PASSWORD"

      - name: Decode upload keystore
        shell: bash
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/autoscroll-upload.jks"
          chmod 600 "${RUNNER_TEMP}/autoscroll-upload.jks"

      - name: Test, lint and build signed AAB
        env:
          AUTOSCROLL_UPLOAD_STORE_FILE: ${{ runner.temp }}/autoscroll-upload.jks
          AUTOSCROLL_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          AUTOSCROLL_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          AUTOSCROLL_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew clean :app:testDebugUnitTest :app:lintDebug :app:bundleRelease

      - name: Verify AAB signature
        shell: bash
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: autoscroll-play-release-${{ github.sha }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
